<!DOCTYPE html>
<html>
<head>
<style>
@page {
  size: 85.6mm 54mm;
  margin: 0;
}
* {
  -webkit-print-color-adjust: exact !important;
  print-color-adjust: exact !important;
  box-sizing: border-box;
}
html, body {
  margin: 0;
  padding: 0;
  width: 85.6mm;
  height: 54mm;
}
.no-print {
  display: none !important;
}
.card {
  width: 85.6mm;
  height: 54mm;
  background: blue;
  color: white;
  page-break-after: always;
  break-after: page;
}
.card2 {
  width: 85.6mm;
  height: 54mm;
  background: green;
  color: white;
}
</style>
</head>
<body>
<div class="no-print">Do not print me</div>
<div class="card">Card 1 Front</div>
<div class="card2">Card 2 Back</div>
</body>
</html>
